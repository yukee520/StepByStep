name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Force-install Metro and Babel resolver packages
        run: |
          set -e
          mkdir -p ~/pkgs
          cd ~/pkgs
          curl -fsLO https://registry.npmjs.org/@react-native/metro-config/-/metro-config-0.75.4.tgz
          curl -fsLO https://registry.npmjs.org/babel-plugin-module-resolver/-/babel-plugin-module-resolver-5.0.3.tgz

          cd "$GITHUB_WORKSPACE"
          npm install --no-save --legacy-peer-deps --no-audit --no-fund ~/pkgs/metro-config-0.75.4.tgz
          npm install --no-save --legacy-peer-deps --no-audit --no-fund ~/pkgs/babel-plugin-module-resolver-5.0.3.tgz

          test -f node_modules/@react-native/metro-config/package.json
          test -f node_modules/babel-plugin-module-resolver/package.json
          echo "OK: metro-config and module-resolver are installed"

      - name: Expose Node path to Gradle
        run: |
          echo "NODE_BINARY=$(which node)" >> $GITHUB_ENV
          which node
          node --version

      - name: Pre-bundle JavaScript
        env:
          NODE_ENV: production
          NODE_BINARY: ${{ env.NODE_BINARY }}
        run: |
          mkdir -p ./bundletest
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output ./bundletest/index.android.bundle \
            --assets-dest ./bundletest
          ls -lh ./bundletest/index.android.bundle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set — skipping release keystore, will use debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Build Release APK
        working-directory: android
        env:
          NODE_ENV: production
          NODE_BINARY: ${{ env.NODE_BINARY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify JS bundle is inside APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "APK size:"
          ls -lh "$APK"
          echo ""
          echo "Checking for assets/index.android.bundle..."
          unzip -l "$APK" | grep -E "index.android.bundle" || \
            { echo "ERROR: JS bundle is missing from the APK"; exit 1; }
          echo "OK: JS bundle is present in the APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/release/
          echo "Release APK built successfully"
